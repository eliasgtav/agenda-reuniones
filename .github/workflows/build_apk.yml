name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev

      - name: Instalar buildozer y cython
        run: pip install buildozer==1.5.0 cython==0.29.36

      - name: Pre-clonar p4a (master, Python 3.14 con parches oficiales) y aplicar parches
        run: |
          mkdir -p .buildozer/android/platform
          # "-b master" es obligatorio: el repo de p4a tiene "develop" como
          # rama por defecto, y buildozer (targets/android.py _install_p4a)
          # compara la rama actual (`git branch -vv`) contra p4a.branch
          # ("master"); si no coincide, BORRA el directorio y reclona,
          # descartando los parches sin avisar. Por eso tampoco usamos
          # "checkout <sha>" (deja detached HEAD, que nunca coincide con
          # "master"): nos quedamos en la punta real de master.
          git clone -b master https://github.com/kivy/python-for-android.git \
            .buildozer/android/platform/python-for-android
          python3 scripts/patch_p4a.py
          cd .buildozer/android/platform/python-for-android
          git config user.email 'build@ci' && git config user.name 'CI'
          git add -A
          git diff --cached --quiet || git commit -m 'stdlib.zip STORED + diagnostico start.c'

      - name: Caché de buildozer (NDK/SDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-p4amaster-${{ hashFiles('buildozer.spec', 'scripts/patch_p4a.py') }}
          restore-keys: |
            buildozer-p4amaster-

      - name: Preparar keystore de debug fijo
        run: |
          # Se copia a AMBAS ubicaciones posibles: las herramientas de Android
          # (SDK cmdline-tools / AGP recientes) migraron el directorio de config
          # de usuario de ~/.android a ~/.config/.android (convencion XDG), y
          # segun que ubicacion lea Gradle en este runner puede generar SU PROPIO
          # debug.keystore aleatorio ahi si la encuentra vacia -- eso causaba que
          # la firma del APK cambiara entre builds pese a que ~/.android/debug.keystore
          # si tenia el fijo (visto 2026-08-12/13, runs 31563033074 y 31665162742).
          mkdir -p ~/.android ~/.config/.android
          if [ -f ci/debug.keystore ]; then
            echo "Usando keystore de debug ya committeado (firma estable entre builds)."
            cp ci/debug.keystore ~/.android/debug.keystore
            cp ci/debug.keystore ~/.config/.android/debug.keystore
          else
            echo "No existe ci/debug.keystore todavia: generando uno nuevo."
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Agenda Debug, O=Elias Gaytan Alvino, C=MX"
            cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
          fi
          echo "=== Fingerprint del keystore en ~/.android/debug.keystore ==="
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256|SHA1|Valid from"
          echo "=== Fingerprint del keystore en ~/.config/.android/debug.keystore (debe ser identico) ==="
          keytool -list -v -keystore ~/.config/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256|SHA1|Valid from"

      - name: Compilar APK
        run: buildozer -v android debug

      - name: Verificar firma real del APK compilado
        run: |
          echo "=== Variables de entorno ANDROID_*/HOME (para ver si Gradle mira otro directorio) ==="
          env | grep -Ei "^(ANDROID|HOME|GRADLE)" | sort
          echo "=== Todos los debug.keystore en el filesystem (ruta + fecha de modificacion) ==="
          # || true en cada find: con "set -e" (shell por defecto de los steps de
          # Actions), un find que topa con un directorio sin permisos (p.ej. /root
          # como usuario "runner") devuelve exit != 0 y aborta el resto del step en
          # silencio -- eso paso en el run 31665162742, cortando el diagnostico justo
          # despues de listar los keystore, antes de llegar a apksigner/keytool.
          find / -xdev -name "debug.keystore" -exec ls -la {} \; 2>/dev/null || true
          find /home -name "debug.keystore" -exec ls -la {} \; 2>/dev/null || true
          find /root -name "debug.keystore" -exec ls -la {} \; 2>/dev/null || true
          echo "=== Contenido de ~/.android (deberia tener solo nuestro debug.keystore) ==="
          ls -la ~/.android 2>/dev/null || echo "~/.android no existe"
          echo "=== Contenido de ~/.config/.android (deberia tener solo nuestro debug.keystore) ==="
          ls -la ~/.config/.android 2>/dev/null || echo "~/.config/.android no existe"
          APK=$(ls bin/*.apk | head -n1)
          echo "APK: $APK"
          APKSIGNER=$(find ~/.buildozer/android/platform/android-sdk/build-tools -name apksigner | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "WARN: no se encontro apksigner bajo android-sdk/build-tools"
          else
            echo "Usando apksigner: $APKSIGNER"
            "$APKSIGNER" verify --print-certs "$APK" || true
          fi
          echo "=== Certificado real del APK via keytool -printcert (respaldo si apksigner no esta) ==="
          unzip -p "$APK" META-INF/*.RSA META-INF/*.DSA META-INF/*.EC 2>/dev/null | keytool -printcert 2>/dev/null || echo "Sin firma v1/JAR visible (normal si es solo v2/v3) o unzip fallo."

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AgendaReuniones-APK
          path: bin/*.apk
          retention-days: 30

      - name: Subir keystore de debug como artefacto (solo para guardarlo en el repo una vez)
        if: ${{ !hashFiles('ci/debug.keystore') }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: ~/.android/debug.keystore
          retention-days: 30
